<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Painel · A Fórmula</title>
<link rel="icon" href="/index_assets/a1.webp">
<style>
  :root{
    --teal:#008896; --teal-d:#063237; --teal-700:#00525d; --ink:#16282b;
    --mut:#5c7075; --line:#e2e8e9; --bg:#f2f7f7; --white:#fff;
    --ok:#0a8f5b; --warn:#c67a12; --err:#c0392b;
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);font-size:14.5px;line-height:1.5}
  button{font-family:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit;font-size:14px}
  a{color:var(--teal)}
  .hidden{display:none!important}

  /* login */
  #login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 12px 40px rgba(6,50,55,.08)}
  #login .card{width:100%;max-width:380px}
  .brand{font-weight:800;font-size:20px;color:var(--teal-d);margin:0 0 4px}
  .brand span{color:var(--teal)}
  .sub{color:var(--mut);margin:0 0 24px;font-size:13px}
  label{display:block;font-weight:600;font-size:12.5px;margin:14px 0 6px;color:var(--teal-d)}
  .fld{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:#fbfdfd;outline:none}
  .fld:focus{border-color:var(--teal)}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:10px;padding:12px 20px;font-weight:700;font-size:14px}
  .btn:hover{background:var(--teal-700)} .btn:disabled{opacity:.5;cursor:default}
  .btn--ghost{background:transparent;color:var(--teal);border:1.5px solid var(--teal)}
  .btn--ghost:hover{background:var(--teal);color:#fff}
  .btn--sm{padding:7px 13px;font-size:12.5px;border-radius:8px}
  .btn--danger{background:transparent;color:var(--err);border:1.5px solid var(--err)}
  .btn--danger:hover{background:var(--err);color:#fff}
  .msg{margin-top:14px;font-size:13px;min-height:18px}
  .msg.err{color:var(--err)} .msg.ok{color:var(--ok)}

  /* app shell */
  #app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
  aside{background:var(--teal-d);color:#cfe3e5;padding:22px 16px;display:flex;flex-direction:column;gap:4px}
  aside .brand{color:#fff;font-size:18px;padding:0 8px 18px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:10px;color:#bcd4d6;background:none;border:none;width:100%;text-align:left;font-size:14px;font-weight:600}
  .nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .nav-item.active{background:var(--teal);color:#fff}
  .nav-item .badge{margin-left:auto;background:#fff;color:var(--teal-d);border-radius:999px;font-size:11px;font-weight:800;padding:1px 8px}
  aside .foot{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.12);font-size:12px}
  aside .foot .who{color:#9fc0c3;margin-bottom:10px;word-break:break-all}
  main{padding:30px 34px;overflow:auto;max-height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}
  h1.page{margin:0;font-size:24px;color:var(--teal-d)}
  .hint{color:var(--mut);font-size:13px;margin:2px 0 0}

  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
  th{background:#eef4f4;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-700)}
  tr:last-child td{border-bottom:none}
  tr:hover td{background:#fafcfc}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px}
  .tag.new{background:#fff2d6;color:#8a5a00} .tag.done{background:#d8f3e6;color:#0a6b45}
  .tag.pending{background:#fff2d6;color:#8a5a00} .tag.approved{background:#d8f3e6;color:#0a6b45} .tag.rejected{background:#f7dcd7;color:#a02b1a}
  .empty{padding:40px;text-align:center;color:var(--mut);background:#fff;border:1px dashed var(--line);border-radius:12px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
  .toolbar .search{flex:1;min-width:200px;max-width:340px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:1100px){.grid2{grid-template-columns:1fr}}
  @media(max-width:760px){#app{grid-template-columns:1fr}aside{flex-direction:row;flex-wrap:wrap;max-height:none}main{max-height:none}
    #rows table{min-width:720px}}
  /* Quem rola horizontalmente é a TABELA, nunca o painel. Sem largura mínima aqui: antes esta
     regra só valia abaixo de 760px, e entre 761 e ~1150px a tabela empurrava o <main> (que tem
     overflow:auto) — o conteúdo ia pra fora da tela sem nada indicar que havia mais à direita.
     Zoom do Windows a 125% num 1366 cai exatamente nessa faixa. Medido: 207px escondidos a 900px. */
  #rows{overflow-x:auto}
  /* E-mail ou palavra longa sem espaço não pode esticar a coluna indefinidamente. */
  #rows td{overflow-wrap:anywhere}
  textarea.fld{min-height:120px;resize:vertical;line-height:1.6}
  textarea.code{min-height:340px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}
  .postrow-title{font-weight:600;color:var(--teal-d)}
  .modal-bg{position:fixed;inset:0;background:rgba(6,50,55,.5);display:flex;align-items:flex-start;justify-content:center;padding:30px 16px;overflow:auto;z-index:50}
  .modal{background:#fff;border-radius:16px;max-width:820px;width:100%;padding:28px}
  .modal h2{margin:0 0 18px;color:var(--teal-d)}
  .banner-note{background:#fff8e8;border:1px solid #f0dfb0;color:#7a5a12;border-radius:10px;padding:12px 14px;font-size:13px;margin-bottom:18px}
  .pubbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .pubbar .dot{width:9px;height:9px;border-radius:50%;background:var(--warn)}
  .pubbar.clean .dot{background:var(--ok)}

  /* ---- dashboard de leads (mobile-first: 1 coluna; expande em 640/1024) ----
     Especificações de marca conforme o protocolo de dataviz: marca fina, ponta de dado
     arredondada em 4px e quadrada na linha de base, grade em hairline recessivo, valor
     só na ponta da barra (a % vive no tooltip), texto sempre em token de texto — nunca
     na cor da série. Uma série só por gráfico ⇒ nenhuma legenda. */
  .dash{margin-bottom:18px;display:flex;flex-direction:column;gap:12px}

  /* herói: o número que o painel lidera, os secundários na mesma faixa (economiza uma linha
     inteira de cartões) e a evolução no tempo logo abaixo — tudo num só cartão. */
  .hero{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 16px 10px}
  /* Três faixas empilhadas em vez de um flex com 5 filhos e margin-left:auto: título+controle,
     números, gráfico. O flex amontoava em tela média e a ordem de leitura ficava imprevisível. */
  .hero-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}
  .hero-head h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-700)}
  .hero-head .seg{margin-left:auto}
  /* grade regular: as colunas alinham por baixo e não dançam conforme o texto do rótulo */
  /* max-content, não fr: com fr as quatro colunas esticavam pela largura toda e os números ficavam
     órfãos, longe uns dos outros. Agrupados à esquerda eles se leem como um conjunto. */
  .hero-stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;align-items:end;margin-bottom:10px}
  @media(min-width:720px){.hero-stats{grid-template-columns:repeat(4,minmax(0,max-content));
    gap:12px 44px;justify-content:start}}
  /* figuras proporcionais (sem tabular-nums): em corpo grande, dígitos de largura fixa afrouxam o número */
  .hero .n{font-size:38px;font-weight:800;color:var(--teal-d);line-height:.95;letter-spacing:-.02em}
  .hero .l{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-700);font-weight:700;margin-top:3px}
  .hero .mn{font-size:19px;font-weight:800;color:var(--teal-d);line-height:1.15}
  .hero .ml{font-size:10.5px;color:var(--mut);font-weight:600;margin-top:2px;line-height:1.35}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;
        border-radius:999px;padding:2px 9px;background:#eef4f4;color:var(--teal-700)}
  .chip.up{background:#e0f4ea;color:#08774c} .chip.down{background:#fbe6e2;color:#a3301f}

  /* Altura fixa e enxuta. preserveAspectRatio="none" estica os caminhos, então a linha usa
     non-scaling-stroke e o ponto/rótulo saem do SVG pra overlay HTML — texto esticado na
     horizontal fica deformado, e círculo esticado vira elipse. */
  .spark{position:relative;height:78px}
  .spark svg{display:block;width:100%;height:100%}
  .spark .dot{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--teal);
              box-shadow:0 0 0 2px #fff;transform:translate(-50%,-50%);pointer-events:none}
  .spark .pk{position:absolute;transform:translate(-50%,-100%);font-size:11.5px;font-weight:700;
             color:var(--ink);white-space:nowrap;pointer-events:none}
  /* faixas de hover: alvo de largura cheia, invisíveis até o mouse chegar */
  .spark .hit{position:absolute;inset:0;display:flex}
  .spark .hit>span{flex:1;cursor:crosshair}
  .spark .hit>span.on{background:rgba(0,136,150,.07)}
  .axis{display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);
        font-variant-numeric:tabular-nums;margin-top:4px}
  /* dia / semana / mês — um segmented control discreto, no canto do cartão */
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fbfdfd}
  .seg button{background:none;border:none;padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--mut)}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button:hover{color:var(--teal-700);background:#f2f7f7}
  .seg button.on{background:var(--teal);color:#fff}

  /* ---- mapa de bolhas (proporcional ao volume) ----
     Bolha, não estado pintado: lead se concentra em cidade, e pintar o estado faria o Amazonas
     (1,5 mi de km²) gritar mais alto que São Paulo com um décimo dos leads. Raio ∝ √volume,
     porque quem lê compara ÁREA — raio ∝ volume exageraria o maior em quadrado. */
  /* Container query, não media query: o que decide se mapa e ranking ficam lado a lado é a largura
     do CARTÃO, não a da tela. Com @media o cartão ficava estreito exatamente quando a grade virava
     2 colunas (≥1024px) e o mapa desabava pra 121px. Padrão = empilhado, então navegador sem
     suporte cai no layout legível. */
  .mapwrap{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  @container (min-width:430px){.mapwrap{grid-template-columns:minmax(0,1fr) 170px}}
  /* O contorno do Brasil é quase quadrado (1000×1051): sem teto de altura, largura cheia viraria
     800px de mapa e o dashboard dobra de tamanho. aspect-ratio mantém a proporção; o max-height
     entra na frente em tela larga e o SVG se encaixa centralizado. */
  .map{position:relative;background:#f7fafa;border:1px solid var(--line);border-radius:10px;overflow:hidden;
       aspect-ratio:1000/1051;max-height:330px;margin:0 auto;width:100%}
  .map svg{display:block;width:100%;height:100%}
  .map .uf{fill:#e7edee;stroke:#fff;stroke-width:1.1;vector-effect:non-scaling-stroke}
  .map .uf.hot{fill:#dde7e8}
  .bub{fill:var(--teal);fill-opacity:.42;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer}
  .bub:hover,.bub.on{fill-opacity:.72}
  .bub.on{stroke:var(--teal-d)}
  .maplegend{display:flex;align-items:flex-end;gap:14px;font-size:11px;color:var(--mut);margin-top:8px;padding-left:2px}
  .maplegend .sw{display:flex;align-items:center;gap:5px}
  .maplegend i{display:block;border-radius:50%;background:var(--teal);opacity:.42;border:1.5px solid #fff}
  .mapnote{font-size:11px;color:var(--mut);margin:8px 0 0;line-height:1.4}

  /* align-items:start — cada cartão tem a altura do seu conteúdo. Esticando, o cartão baixo ao
     lado do mapa abria um vão de ~400px DENTRO dele; espaço entre cartões incomoda menos. */
  .panels{display:grid;grid-template-columns:1fr;gap:12px;align-items:start}
  @media(min-width:1024px){.panels{grid-template-columns:1fr 1fr}.span2{grid-column:1/-1}}
  .pcol{display:flex;flex-direction:column;gap:12px;min-width:0}
  .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px;
         display:flex;flex-direction:column;min-width:0;container-type:inline-size}
  .panel h3{margin:0;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--teal-700);
            display:flex;align-items:center;gap:6px}
  .panel h3 .cnt{margin-left:auto;letter-spacing:0;text-transform:none;font-size:11.5px;color:var(--mut);font-weight:600}
  .panel .ph{font-size:11.5px;color:var(--mut);margin:3px 0 9px;line-height:1.4}
  .panel.warn{border-color:#f0dfb0;background:#fffdf6}
  .panel.warn h3{color:#8a5a00}
  /* "ver todas" empurrado pro rodapé do cartão: com 2 painéis lado a lado de alturas diferentes,
     o botão de um não pode flutuar no meio do vão do outro. */
  .more{padding-top:9px;background:none;border:none;align-self:flex-start;
        font-size:11.5px;font-weight:700;color:var(--teal);padding-left:6px}
  .more:hover{text-decoration:underline}

  /* linha = rótulo + barra proporcional + valor na ponta. Botão: clicar filtra a tabela. */
  .bars{display:flex;flex-direction:column;gap:1px}
  .bar{display:grid;grid-template-columns:minmax(88px,36%) 1fr auto;align-items:center;gap:12px;
       background:none;border:none;padding:4px 6px;border-radius:7px;width:100%;text-align:left;font-size:13px;color:var(--ink)}
  .bar:hover{background:#f4f9f9} .bar:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
  .bar.on{background:#e6f2f3;box-shadow:inset 0 0 0 1.5px var(--teal)}
  .bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  /* trilha = passo mais claro da mesma rampa; preenchimento quadrado na base, 4px na ponta do dado */
  .bar .tr{background:#eaf2f2;border-radius:4px;height:10px;overflow:hidden}
  .bar .fl{display:block;height:100%;border-radius:0 4px 4px 0;background:var(--teal);transition:width .18s ease-out}
  .panel.warn .bar .fl{background:var(--warn)}
  .panel.warn .bar .tr{background:#f6ecd8}
  .bar .vl{font-variant-numeric:tabular-nums;font-weight:700;color:var(--teal-d);min-width:1.8em;text-align:right}
  .dash-empty{font-size:13px;color:var(--mut)}

  /* tooltip único e flutuante — os valores também estão na barra e na tabela, nunca só aqui */
  #ttip{position:fixed;z-index:80;pointer-events:none;opacity:0;transition:opacity .12s;
        background:var(--teal-d);color:#fff;font-size:12px;line-height:1.45;padding:7px 10px;border-radius:8px;
        box-shadow:0 6px 20px rgba(6,50,55,.22);max-width:240px}
  #ttip b{color:#fff}
  #ttip .k{color:#9fc7cc}

  /* Ação neutra, não aviso: CEP só virou obrigatório em 05/08/2026, então lead antigo sem CEP é
     o dado que existia — não é pendência e não pinta de âmbar. Só aparece quando há algo a fazer. */
  .bfbar{font-size:12.5px;color:var(--mut);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .bfbar .t{flex:1;min-width:180px}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login">
  <div class="card">
    <p class="brand">a <span>fórmula</span> · painel</p>
    <p class="sub">Acesso restrito à equipe.</p>
    <form id="loginForm">
      <label for="lg-email">E-mail</label>
      <input id="lg-email" class="fld" type="email" autocomplete="username" placeholder="voce@aformulabrasil.com.br">
      <label for="lg-pass">Senha</label>
      <input id="lg-pass" class="fld" type="password" autocomplete="current-password" placeholder="••••••••">
      <div style="margin-top:20px"><button class="btn" style="width:100%" type="submit">Entrar</button></div>
      <p id="lg-msg" class="msg"></p>
      <p style="margin-top:4px"><a href="#" id="lg-forgot" style="font-size:12.5px">Esqueci minha senha</a></p>
      <p id="lg-diag" style="margin-top:16px;font-size:11px;color:var(--mut);line-height:1.5"></p>
    </form>
  </div>
</section>

<!-- APP -->
<div id="app" class="hidden">
  <aside>
    <p class="brand">a fórmula</p>
    <button class="nav-item active" data-view="inbox">📥 Mensagens <span class="badge hidden" id="badge-inbox">0</span></button>
    <button class="nav-item" data-view="prescritores">🩺 Prescritores <span class="badge hidden" id="badge-presc">0</span></button>
    <button class="nav-item" data-view="career">💼 Trabalhe conosco <span class="badge hidden" id="badge-career">0</span></button>
    <button class="nav-item" data-view="newsletter">✉️ Newsletter</button>
    <button class="nav-item" data-view="preContent">🔬 Conteúdo prescritor</button>
    <button class="nav-item" data-view="settings">⚙️ Configurações</button>
    <div class="foot">
      <div class="who" id="who"></div>
      <button class="btn btn--ghost btn--sm" style="width:100%;color:#bcd4d6;border-color:rgba(255,255,255,.3)" id="logout">Sair</button>
    </div>
  </aside>
  <main>
    <div class="pubbar" id="pubbar">
      <span class="dot"></span>
      <div style="flex:1">
        <strong id="pub-title">Alterações são salvas na hora.</strong>
        <div class="hint" id="pub-hint">O “e-mail p/ notificações” e o Conteúdo do prescritor valem na hora. Os demais campos de Configurações (redes, e-mails do site, anos) só aparecem no site depois de “Publicar no site”.</div>
      </div>
      <button class="btn" id="btn-publish">Publicar no site</button>
    </div>
    <div id="view"></div>
  </main>
</div>

<!-- Firebase compat (vendorizado, CSP-safe) -->
<script src="/admin/vendor/firebase-app-compat.js"></script>
<script src="/admin/vendor/firebase-auth-compat.js"></script>
<script src="/admin/vendor/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyAeag91E__CL4f-4pRnKgezvwEasEUnUOY",
  authDomain: "aformula-institucional.firebaseapp.com",
  projectId: "aformula-institucional",
  appId: "1:139838701463:web:9938229ebeed4c545c8ed2"
});
const auth = firebase.auth();
// Persistência resiliente em cascata: LOCAL (IndexedDB) → SESSION (sessionStorage) → NONE (memória).
// Opera GX e navegadores com anti-fingerprint bloqueiam IndexedDB → LOCAL falha e, sem fallback,
// o próprio signIn não completa. Caindo pro próximo nível o login FUNCIONA (mesmo que a sessão não
// sobreviva a fechar a aba). O submit do login aguarda `persistenceReady` antes de autenticar.
const _P = firebase.auth.Auth.Persistence;
const persistenceReady = auth.setPersistence(_P.LOCAL).catch(err=>{ // sessão persiste entre reloads/abas
  try{ localStorage.setItem('cmsx_persist_err', JSON.stringify({code:(err&&err.code)||'', msg:(err&&err.message)||'', at:new Date().toISOString()})); }catch(_){}
  return auth.setPersistence(_P.SESSION);        // sessionStorage: persiste na aba
}).catch(()=> auth.setPersistence(_P.NONE))      // memória: pelo menos loga nesta sessão
  .catch(()=>{});                                // último recurso: segue com o default do SDK
const db = firebase.firestore();
// Firestore usa streaming (WebChannel) por padrão; redes corporativas, proxies, VPNs e alguns
// antivírus bloqueiam esse canal → a leitura pendura sem retornar e o login TRAVA em "Entrando…".
// Auto-detecta a falha e cai pra long-polling (HTTP normal), que passa nessas redes.
try{ db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); }catch(_){}
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// href vindo de campo público (o LinkedIn do candidato). esc() impede quebrar o atributo, mas
// não impede `javascript:` — que executaria NA SESSÃO DO ADMIN ao clicar. Só http(s) passa.
const escUrl = s => { const v=String(s||'').trim(); return /^https?:\/\//i.test(v) ? esc(v) : ''; };
const MESES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
function fmtTs(ts){ if(!ts) return '—'; const d=ts.toDate?ts.toDate():new Date(ts); return `${String(d.getDate()).padStart(2,'0')}/${MESES[d.getMonth()]} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
// Data completa (com ano) p/ exports CSV — evita ambiguidade entre anos.
function fmtTsCSV(ts){ if(!ts) return ''; const d=ts.toDate?ts.toDate():new Date(ts); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
// Neutraliza fórmulas em CSV (Excel executa células que começam com = + - @) — segurança do export.
const csvSafe = v => { const s=(v==null?'':String(v)); return /^[=+\-@\t\r]/.test(s) ? "'"+s : s; };

/* ---------- GEO DE LEADS (espelha api/_lib/unidade.js) ----------
   Existe no cliente por dois motivos: (1) UF sai das faixas oficiais de CEP, offline — os leads
   antigos ganham localização sem tocar em rede nenhuma; (2) o backfill (resolver a UNIDADE dos
   leads gravados antes de 11/08/2026) roda aqui em vez de virar uma função serverless nova — o
   projeto tem 10 e o teto do plano é 12. Mudou a regra no servidor? Espelhar aqui. */
const RAIO_MAX_KM = 150;   // idem servidor: acima disto "a unidade mais próxima" não atende
const UF_FAIXAS=[[1000,19999,'SP'],[20000,28999,'RJ'],[29000,29999,'ES'],[30000,39999,'MG'],[40000,48999,'BA'],[49000,49999,'SE'],[50000,56999,'PE'],[57000,57999,'AL'],[58000,58999,'PB'],[59000,59999,'RN'],[60000,63999,'CE'],[64000,64999,'PI'],[65000,65999,'MA'],[66000,68899,'PA'],[68900,68999,'AP'],[69000,69299,'AM'],[69300,69399,'RR'],[69400,69899,'AM'],[69900,69999,'AC'],[70000,72799,'DF'],[72800,72999,'GO'],[73000,73699,'DF'],[73700,76799,'GO'],[76800,76999,'RO'],[77000,77999,'TO'],[78000,78899,'MT'],[78900,78999,'RO'],[79000,79999,'MS'],[80000,87999,'PR'],[88000,89999,'SC'],[90000,99999,'RS']];
const digits = s => String(s==null?'':s).replace(/\D/g,'');
function ufDoCep(cep){ const c=digits(cep); if(c.length!==8) return null; const p=+c.slice(0,5);
  for(const [i,f,uf] of UF_FAIXAS) if(p>=i&&p<=f) return uf; return null; }
function haversine(a,b,c,d){ const R=6371,p=Math.PI/180,dLat=(c-a)*p,dLon=(d-b)*p;
  const x=Math.sin(dLat/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x)); }
let _lojas=null;
async function getLojas(){
  if(_lojas) return _lojas;
  const r=await fetch('/encontre-uma-loja_assets/lojas.json');
  const l=await r.json();
  // "em breve" = unidade anunciada que ainda não atende → não pode contar como receptora de lead.
  _lojas=(Array.isArray(l)?l:[]).filter(s=>s.lat&&s.lng&&!/em breve/i.test(s.nome||''));
  return _lojas;
}
async function jget(url){ try{ const r=await fetch(url); return r.ok?await r.json():null; }catch(_){ return null; } }
async function geocodeCep(cep){
  const c=digits(cep); if(c.length!==8) return null;
  const a=await jget(`https://cep.awesomeapi.com.br/json/${c}`);
  if(a&&a.lat&&a.lng) return {lat:+a.lat,lng:+a.lng,cidade:a.city||null,uf:a.state||null};
  const v=await jget(`https://viacep.com.br/ws/${c}/json/`);
  if(!v||v.erro) return null;
  const q=encodeURIComponent(`${v.logradouro?v.logradouro+', ':''}${v.localidade||''} ${v.uf||''} Brasil`);
  const n=await jget(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${q}`);
  if(!n||!n[0]) return null;
  return {lat:+n[0].lat,lng:+n[0].lon,cidade:v.localidade||null,uf:v.uf||null};
}
// Mesmo contrato do analisarCep() do servidor: a unidade mais próxima vem SEMPRE, com o flag
// foraDeRaio. Pro mapa de leads, demanda longe de qualquer loja é o dado mais valioso que existe.
async function analisarCep(cep){
  const out={cepUf:ufDoCep(cep),cepCidade:null,cepLat:null,cepLng:null,unidade:null,unidadeSlug:null,unidadeCidade:null,unidadeUf:null,distanciaKm:null,foraDeRaio:null};
  const loc=await geocodeCep(cep); if(!loc) return out;
  out.cepCidade=loc.cidade||null; out.cepUf=out.cepUf||loc.uf||null;
  out.cepLat=loc.lat; out.cepLng=loc.lng;   // coordenada p/ o mapa de bolhas
  const lojas=await getLojas(); if(!lojas.length) return out;
  let melhor=null;
  for(const s of lojas){ const d=haversine(loc.lat,loc.lng,s.lat,s.lng); if(!melhor||d<melhor.d) melhor={s,d}; }
  out.unidade=melhor.s.nome||null; out.unidadeSlug=melhor.s.slug||null;
  out.unidadeCidade=melhor.s.cidade||null; out.unidadeUf=melhor.s.estado||null;
  out.distanciaKm=Math.round(melhor.d); out.foraDeRaio=melhor.d>RAIO_MAX_KM;
  return out;
}

/* ---------- TOOLTIP (um só, reaproveitado) ----------
   Realça, nunca esconde: todo valor que aparece aqui também está na barra, no eixo ou na tabela.
   Responde a foco de teclado além do mouse — quem navega por Tab lê a mesma coisa. */
function wireTips(raiz){
  let el=$('#ttip');
  if(!el){ el=document.createElement('div'); el.id='ttip'; document.body.appendChild(el); }
  const mostra=(t,alvo)=>{
    el.innerHTML=t; el.style.opacity='1';
    const r=alvo.getBoundingClientRect(), b=el.getBoundingClientRect();
    // clampeado na viewport: tooltip de barra na borda direita não pode sair da tela
    el.style.left=Math.max(8,Math.min(window.innerWidth-b.width-8,r.left+r.width/2-b.width/2))+'px';
    el.style.top=(r.top-b.height-9<8 ? r.bottom+9 : r.top-b.height-9)+'px';
  };
  const esconde=()=>{ el.style.opacity='0'; };
  raiz.querySelectorAll('[data-tip]').forEach(n=>{
    const on=()=>{ mostra(n.dataset.tip,n); n.classList.add('on'); };
    const off=()=>{ esconde(); n.classList.remove('on'); };
    n.addEventListener('mouseenter',on); n.addEventListener('mouseleave',off);
    n.addEventListener('focus',on);      n.addEventListener('blur',off);
  });
}

// Gate no cliente é só UX — o gate REAL é o servidor (verifyAdmin) + as regras do Firestore.
// Por isso NUNCA deslogamos por erro transitório (rede, refresh de token, signOut de outra aba):
// só deslogamos se a leitura teve SUCESSO e o doc de admin não existe (negação definitiva).
auth.onAuthStateChanged(async user=>{
  if(!user){
    if(cmsxWasIn && !cmsxHandled) cmsxNote('firebase-encerrou'); // não fomos nós → o Firebase encerrou a sessão (na mesma aba)
    else if(!cmsxWasIn && !cmsxHandled){ // página nova: havia sessão gravada e não restaurou? (bug clássico Opera GX)
      try{ if(localStorage.getItem('cmsx_hadSession')==='1') cmsxNote('sessao-nao-restaurada'); }catch(_){}
    }
    cmsxWasIn=false; cmsxHandled=false;
    try{ localStorage.removeItem('cmsx_hadSession'); }catch(_){}
    $('#login').classList.remove('hidden'); $('#app').classList.add('hidden'); cmsxDiag(); return;
  }
  cmsxWasIn=true; cmsxLastEmail=user.email;
  try{ localStorage.setItem('cmsx_hadSession','1'); }catch(_){}
  // Confirma a allowlist ANTES de mostrar o painel: evita flash da UI privilegiada e leituras negadas
  // (o e-mail é normalizado p/ minúsculas — bate com o doc admins/{email} e com o verifyAdmin do servidor).
  let allowed=true;
  try{
    // Corrida com timeout: se a leitura do Firestore pendurar (WebChannel bloqueado, rede ruim),
    // não travamos o login pra sempre — libera o painel e deixa o servidor barrar quem não é admin.
    const snap = await Promise.race([
      db.collection('admins').doc((user.email||'').toLowerCase()).get(),
      new Promise((_,rej)=>setTimeout(()=>rej(new Error('admins-read-timeout')), 7000))
    ]);
    allowed = snap.exists;
  }
  catch(_){ allowed=true; /* erro/timeout transitório: mantém logado — o servidor (verifyAdmin) barra quem não é admin */ }
  if(!allowed){
    cmsxNote('nao-admin'); cmsxHandled=true;
    $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
    const m=$('#lg-msg'); m.className='msg err'; m.textContent='Este usuário não tem acesso ao painel.';
    await auth.signOut(); return;
  }
  $('#lg-msg').textContent='';
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#who').textContent = user.email;
  loadCounts(); router('inbox');
});

/* Upload de mídia (Vercel Blob via /api/upload, gated por admin) — usado pelo Conteúdo do prescritor (PDF) */
async function uploadFile(file){
  if(file.size>4*1024*1024) throw new Error('Arquivo acima de 4 MB — reduza antes de enviar.');
  if(!auth.currentUser) throw new Error('Sessão expirou. Recarregue a página e entre de novo.');
  const token=await auth.currentUser.getIdToken();
  const r=await fetch('/api/upload?filename='+encodeURIComponent(file.name)+'&type='+encodeURIComponent(file.type||'application/octet-stream'),
    {method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/octet-stream'},body:file});
  const j=await r.json().catch(()=>({}));
  if(!j.ok) throw new Error(j.error==='type'?'Formato não permitido (use imagem ou PDF).':'Falha no upload — tente de novo.');
  return j.url;
}

/* ---------- INBOX (contatos) + DASHBOARD DE LEADS ----------
   Valores especiais dos filtros de unidade: __fora__ = existe loja, mas a mais próxima está a
   mais de 150 km (demanda descoberta); __none__ = CEP não resolvido (backfill pendente ou CEP
   inválido). Sem esses dois, um lead somem da soma sem o operador perceber. */
const F_FORA='__fora__', F_NONE='__none__';
// Unidade que EFETIVAMENTE recebe o lead. `rotaUnidade` (gravado desde 11/08/2026) manda, porque
// é quem a notificação interna mandou atender — inclui o lead fora de raio roteado pra loja
// própria. Sem ela, cai na regra antiga: dentro do raio conta, fora não (fora ia pro localizador,
// então creditar a loja inflaria o ranking dela).
const unidadeDe = m => m.rotaUnidade || ((m.unidade && !m.foraDeRaio) ? m.unidade : null);
const ufDe = m => m.cepUf || ufDoCep(m.cep) || null;
// '' (não 'sem localização') quando o CEP não diz nada: quem chama omite a linha em vez de
// escrever uma ausência. Lead antigo sem CEP é normal — o formulário só passou a exigir em 05/08.
const pracaDe = m => (m.cepCidade ? m.cepCidade+(ufDe(m)?'/'+ufDe(m):'') : (ufDe(m)?'CEP '+String(m.cep||'').slice(0,5)+'… ('+ufDe(m)+')' : ''));
// Legado: gravado antes de 11/08/2026, quando o contato passou a guardar unidade e coordenada.
// O teste é `cepLat===undefined` (campo AUSENTE), não falsy: geocode que falha grava null, e null
// significa "já tentamos, não deu" — retestar pra sempre seria loop. `geoAt` marca a tentativa.
const pendenteGeo = m => m.cepLat===undefined && !m.geoAt && digits(m.cep).length===8;

async function vInbox(){
  const v=$('#view');
  v.innerHTML=`<div class="topbar"><div><h1 class="page">Mensagens de contato</h1><p class="hint" id="i-count"></p></div><button class="btn" id="i-csv">⬇ Exportar CSV</button></div>
  <div id="bfwrap" style="margin-bottom:16px"></div>
  <div class="toolbar">
    <select class="fld" id="if-status" style="max-width:160px"><option value="">Status: todos</option><option value="new">Novos</option><option value="done">Resolvidos</option></select>
    <select class="fld" id="if-assunto" style="max-width:230px"><option value="">Assunto: todos</option></select>
    <select class="fld" id="if-unidade" style="max-width:250px"><option value="">Unidade: todas</option></select>
    <select class="fld" id="if-uf" style="max-width:120px"><option value="">UF: todas</option></select>
    <select class="fld" id="if-mkt" style="max-width:180px"><option value="">Marketing: todos</option><option value="1">Aceita</option><option value="0">Não aceita</option></select>
    <input class="fld search" id="if-q" placeholder="Buscar nome, e-mail, cidade, mensagem…">
    <button class="btn btn--ghost btn--sm" id="if-clear">Limpar</button>
  </div>
  <div class="dash" id="dash"></div>
  <div id="rows">Carregando…</div>`;
  let all=[], current=[], silenciar=false;
  /* Sem teto de 500: o dashboard precisa do TOTAL real. Duas fontes mescladas por id —
     (1) carga única da coleção inteira ao abrir a aba; (2) o listener ao vivo segue nos 500
     mais recentes (lead novo entra na hora; o histórico já está na memória pela carga única).
     NUNCA deletar via docChanges 'removed': num query com limit ele também dispara quando um
     doc sai da janela dos 500 (chegou lead novo), e apagar por ele sumiria com lead vivo.
     Apagar nesta sessão remove do mapa local; apagado em OUTRA sessão só some ao recarregar. */
  const porId=new Map();
  const tsDe=m=>{ const t=m.createdAt; if(!t) return 0; const d=t.toDate?t.toDate():new Date(t); const n=d.getTime(); return isNaN(n)?0:n; };
  const absorver=docs=>docs.forEach(d=>porId.set(d.id,Object.assign(porId.get(d.id)||{},{id:d.id},d.data())));
  function reconstruir(){ all=[...porId.values()].sort((a,b)=>tsDe(b)-tsDe(a)); }
  function refletir(){ if(silenciar) return; sincronizarFiltros(); badgeInbox(); apply(); }

  const fill=(sel,vals)=>{const s=$(sel);[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt')).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o);});};
  // Idempotente: roda a cada atualização ao vivo. Preserva a seleção do operador — um lead novo
  // não pode zerar o filtro que ele acabou de aplicar. Se o valor selecionado deixar de existir
  // na lista, ele é MANTIDO como opção órfã em vez de sumir (sumir mudaria a tabela sem aviso).
  function sincronizarFiltros(){
    [['#if-assunto',all.map(m=>m.assunto),null],
     ['#if-uf',all.map(ufDe),null],
     ['#if-unidade',all.map(unidadeDe),`<option value="${F_FORA}">⚠ sem loja em 150 km</option><option value="${F_NONE}">sem localização</option>`]
    ].forEach(([sel,vals,extra])=>{
      const el=$(sel), escolhido=el.value, primeira=el.querySelector('option').outerHTML;
      el.innerHTML=primeira; fill(sel,vals);
      if(extra) el.insertAdjacentHTML('beforeend',extra);
      if(escolhido && !el.querySelector(`option[value="${CSS.escape(escolhido)}"]`)){
        el.insertAdjacentHTML('beforeend',`<option value="${esc(escolhido)}">${esc(escolhido)}</option>`);
      }
      el.value=escolhido;
    });
  }
  function badgeInbox(){
    const n=all.filter(m=>(m.status||'new')==='new').length, b=$('#badge-inbox');
    if(!b) return;
    if(n){ b.textContent=n; b.classList.remove('hidden'); } else b.classList.add('hidden');
  }

  // Carga única do histórico completo — o que estiver além dos 500 do listener vem daqui.
  db.collection('contact_messages').orderBy('createdAt','desc').get()
    .then(snap=>{ absorver(snap.docs); reconstruir(); refletir(); })
    .catch(e=>console.error('[inbox] carga completa', e));
  // Tempo real: lead novo entra na tabela e recalcula o dashboard sem recarregar a página.
  unsubInbox = db.collection('contact_messages').orderBy('createdAt','desc').limit(500)
    .onSnapshot(snap=>{
      absorver(snap.docs); reconstruir();
      // O backfill grava centenas de docs em sequência; cada um voltaria como evento aqui e
      // re-renderizaria a tela no meio do loop. Ele re-renderiza uma vez, no fim (refletir
      // respeita o `silenciar`).
      refletir();
    }, err=>{
      console.error('[inbox] listener', err);
      // Erro depois do primeiro carregamento: mantém o que está na tela em vez de apagar tudo.
      if(!all.length) $('#rows').innerHTML='<div class="empty">Não foi possível carregar as mensagens. Recarregue a página.</div>';
    });
  function apply(){
    const st=$('#if-status').value, as=$('#if-assunto').value, un=$('#if-unidade').value,
          uf=$('#if-uf').value, mk=$('#if-mkt').value, q=$('#if-q').value.trim().toLowerCase();
    current=all.filter(m=>(!st||(m.status||'new')===st)&&(!as||m.assunto===as)
      &&(!uf||ufDe(m)===uf)
      &&(!un|| (un===F_FORA ? m.foraDeRaio===true : un===F_NONE ? (!m.unidade&&!m.foraDeRaio) : unidadeDe(m)===un))
      &&(mk===''||(mk==='1'?!!m.marketing:!m.marketing))
      &&(!q||[m.nome,m.email,m.telefone,m.mensagem,m.cep,m.cepCidade,m.unidade].some(x=>String(x||'').toLowerCase().includes(q))));
    // Base vazia é estado diferente de "filtro sem resultado" — o dashboard não tem o que mostrar.
    if(!all.length){
      $('#i-count').textContent='Nenhuma mensagem ainda.';
      $('#dash').innerHTML=''; $('#bfwrap').innerHTML='';
      $('#rows').innerHTML='<div class="empty">Nenhuma mensagem ainda.</div>';
      return;
    }
    const nNew=all.filter(m=>(m.status||'new')==='new').length;
    $('#i-count').textContent=`${current.length} de ${all.length} mensagem(ns) · ${nNew} nova(s).`;
    renderDash(current, all.length);
    renderBackfill();
    render(current);
  }

  /* ----- dashboard ----- */
  // Rótulo clicável → aplica o filtro correspondente. É o que transforma o painel de "quadro
  // bonito" em navegação: vejo o pico, clico, leio os leads que o formaram.
  // Teto de 5 linhas por painel, com botão de expandir. A escala das barras é sempre do MAIOR
  // da lista inteira, não do maior das 5 visíveis — senão expandir reescalaria tudo e a leitura
  // "esta é o dobro daquela" mudaria de significado ao clicar. Nada é cortado em silêncio: o
  // botão diz quantas faltam e a lista inteira também está no CSV.
  const TETO=5;
  const expandido={};   // sobrevive ao re-render (filtrar não fecha o painel que você abriu)
  function bars(list, total, filtro, ativo, chave){
    if(!list.length) return '<p class="dash-empty">Sem dados para o filtro atual.</p>';
    const max=Math.max(...list.map(x=>x[1]))||1;
    const aberto=!!expandido[chave||filtro], vis=aberto?list:list.slice(0,TETO);
    const linha=([nome,n,val])=>{
      const pc=total?Math.round(n*100/total):0;
      return `<button class="bar${ativo===(val===undefined?nome:val)?' on':''}" data-f="${filtro}" data-v="${esc(val===undefined?nome:val)}"
        data-tip="<b>${esc(nome)}</b><br>${n} lead(s) · ${pc}% do total filtrado<br><span class='k'>clique para filtrar</span>">
        <span class="nm">${esc(nome)}</span>
        <span class="tr"><span class="fl" style="width:${Math.max(2,Math.round(n*100/max))}%"></span></span>
        <span class="vl">${n}</span></button>`;
    };
    return '<div class="bars">'+vis.map(linha).join('')+'</div>'
      + (list.length>TETO
          ? `<button class="more" data-exp="${esc(chave||filtro)}">${aberto?'▲ mostrar só as 5 maiores':`▼ ver todas as ${list.length}`}</button>`
          : '');
  }

  /* ---------- MAPA DE BOLHAS ----------
     Geometria em asset versionado e cacheado por 1 ano (admin_assets/ pega o header immutable);
     carregada uma vez, sob demanda. Falha de rede → o painel segue sem mapa, nunca quebra. */
  let _geoUF=null, _geoErr=false;
  async function getGeoUF(){
    if(_geoUF||_geoErr) return _geoUF;
    try{ const r=await fetch('/admin_assets/uf-brasil.v1.json'); _geoUF=await r.json(); }
    catch(_){ _geoErr=true; }
    return _geoUF;
  }
  // Mesma projeção do gerador (Mercator) — se divergir, as bolhas caem fora do desenho.
  const mercY = lat => Math.log(Math.tan(Math.PI/4+(lat*Math.PI/180)/2))*180/Math.PI;
  // Limites vindos do próprio IBGE na geração; fixos porque o viewBox foi calculado com eles.
  const BB={minX:-73.9906,maxX:-28.8477,minY:mercY(-33.7511),maxY:mercY(5.2718)};

  function agruparPorCidade(list){
    const m=new Map();
    list.forEach(x=>{
      if(typeof x.cepLat!=='number'||typeof x.cepLng!=='number') return;
      const k=(x.cepCidade||'—')+'|'+(ufDe(x)||'');
      const g=m.get(k)||{cidade:x.cepCidade||'—',uf:ufDe(x)||'',n:0,lat:0,lng:0};
      g.n++; g.lat+=x.cepLat; g.lng+=x.cepLng; m.set(k,g);
    });
    // posição = média dos leads da cidade (não centroide do município): cai onde eles realmente estão
    return [...m.values()].map(g=>({...g,lat:g.lat/g.n,lng:g.lng/g.n})).sort((a,b)=>b.n-a.n);
  }

  async function renderMapa(list, ufAtivo){
    const alvo=$('#mapa'); if(!alvo) return;
    const geo=await getGeoUF();
    if(!geo){ alvo.innerHTML='<p class="mapnote">Não foi possível carregar o mapa. O ranking ao lado tem os mesmos números.</p>'; return; }
    const {w:W,h:H}=geo;
    const sx=lon=>((lon-BB.minX)/(BB.maxX-BB.minX))*W;
    const sy=lat=>((BB.maxY-mercY(lat))/(BB.maxY-BB.minY))*H;
    const cidades=agruparPorCidade(list);
    const semCoord=list.length-cidades.reduce((s,c)=>s+c.n,0);
    const max=Math.max(...cidades.map(c=>c.n),1);
    const R_MAX=W*0.055, R_MIN=W*0.009;
    const raio=n=>R_MIN+(R_MAX-R_MIN)*Math.sqrt(n/max);   // área ∝ volume
    const comLeads=new Set(cidades.map(c=>c.uf));
    // maiores desenhados primeiro: bolha pequena dentro de bolha grande continua clicável
    const bolhas=[...cidades].sort((a,b)=>b.n-a.n).map(c=>
      `<circle class="bub${ufAtivo&&ufAtivo===c.uf?' on':''}" cx="${sx(c.lng).toFixed(1)}" cy="${sy(c.lat).toFixed(1)}"
        r="${raio(c.n).toFixed(1)}" data-uf="${esc(c.uf)}" tabindex="0" role="button"
        data-tip="<b>${esc(c.cidade)}${c.uf?'/'+esc(c.uf):''}</b><br>${c.n} lead(s)<br><span class='k'>clique para filtrar ${esc(c.uf||'')}</span>"></circle>`).join('');
    // A legenda é medida em PIXEL da tela, não em % do seu contêiner: `raio` está em unidades do
    // viewBox (1000), então precisa da escala real do SVG renderizado — senão os círculos saem
    // como pontinhos que não correspondem a bolha nenhuma.
    const legN=[...new Set([1,Math.max(2,Math.round(max/4)),max])].filter(n=>n<=max).slice(-3);
    // .map tem width:100% e max-height:330px com aspect-ratio, então a largura efetiva é a menor
    // entre a coluna e 330·W/H. Calculado ANTES de inserir — depois seria uma segunda medição.
    const escala=Math.min(alvo.clientWidth||330, 330*W/H)/W;
    alvo.innerHTML=`
      <div class="map"><svg viewBox="0 0 ${W} ${H}" role="img"
        aria-label="Mapa do Brasil com ${cidades.length} cidade(s) marcada(s) por volume de leads">
        <g>${Object.entries(geo.uf).map(([uf,d])=>
          `<path class="uf${comLeads.has(uf)?' hot':''}" d="${d}"></path>`).join('')}</g>
        <g>${bolhas}</g>
      </svg></div>
      <div class="maplegend">
        ${legN.map(n=>{const d=Math.max(5,raio(n)*2*escala);
          return `<span class="sw"><i style="width:${d.toFixed(1)}px;height:${d.toFixed(1)}px"></i>${n}</span>`;}).join('')}
        <span style="margin-left:auto">tamanho = nº de leads</span>
      </div>
      ${semCoord?`<p class="mapnote">${semCoord} lead(s) fora do mapa por não ter coordenada do CEP${
        all.filter(pendenteGeo).length?' — o botão acima resolve isso.':'.'}</p>`:''}`;
    wireTips(alvo);
    alvo.querySelectorAll('.bub').forEach(b=>{
      const acionar=()=>{ const s=$('#if-uf'); s.value = s.value===b.dataset.uf ? '' : b.dataset.uf; apply(); };
      b.addEventListener('click',acionar);
      b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); acionar(); } });
    });
  }

  /* Evolução no tempo — a forma que faltava. Uma série só (logo, sem legenda):
     área em lavagem de 10%, linha de 2px, ponto na ponta, linha de base em hairline. Os valores
     não ficam presos ao tooltip: o pico é rotulado direto e a tabela abaixo tem tudo. */
  // dia | semana | mês. Cada um com a sua janela e o seu rótulo — 30 dias de barras diárias conta
  // uma história (picos de campanha), 12 meses conta outra (sazonalidade).
  const PERIODOS={
    dia:   {n:30, rot:'últimos 30 dias',  ini:d=>{const x=new Date(d);x.setHours(0,0,0,0);return x;},
            passo:x=>{const y=new Date(x);y.setDate(y.getDate()+1);return y;},
            fmt:d=>`${String(d.getDate()).padStart(2,'0')}/${MESES[d.getMonth()]}`, un:'dia'},
    semana:{n:12, rot:'últimas 12 semanas',
            ini:d=>{const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;},
            passo:x=>{const y=new Date(x);y.setDate(y.getDate()+7);return y;},
            fmt:d=>`${String(d.getDate()).padStart(2,'0')}/${MESES[d.getMonth()]}`, un:'semana de'},
    mes:   {n:12, rot:'últimos 12 meses', ini:d=>new Date(d.getFullYear(),d.getMonth(),1),
            passo:x=>new Date(x.getFullYear(),x.getMonth()+1,1),
            fmt:d=>`${MESES[d.getMonth()]}/${String(d.getFullYear()).slice(2)}`, un:''},
  };
  let periodo='semana';
  function serie(list){
    const P=PERIODOS[periodo];
    // Constrói pra frente a partir do início da janela: somar 7·864e5 atravessando horário de
    // verão desalinharia os buckets do início-de-semana real.
    const buckets=[]; let cur=P.ini(new Date());
    for(let i=0;i<P.n;i++){ buckets.unshift({ini:cur,n:0}); cur=P.ini(new Date(cur.getTime()-1)); }
    const idx=new Map(buckets.map((b,i)=>[b.ini.getTime(),i]));
    list.forEach(m=>{
      const t=m.createdAt; if(!t) return;
      const d=t.toDate?t.toDate():new Date(t); if(isNaN(d.getTime())) return;
      const i=idx.get(P.ini(d).getTime()); if(i!=null) buckets[i].n++;
    });
    return buckets;
  }
  function areaChart(buckets){
    const W=1000,H=100,PT=18,PB=1;    // PT = folga pro rótulo do pico; PB mantém o pico fora da base
    const max=Math.max(...buckets.map(b=>b.n),1);
    const x=i=>buckets.length<2?W/2:(i*W)/(buckets.length-1);
    const y=n=>PT+(H-PT-PB)*(1-n/max);
    const pts=buckets.map((b,i)=>[x(i),y(b.n)]);
    const linha=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const area=`${linha} L ${W} ${H} L 0 ${H} Z`;
    const iMax=buckets.reduce((a,b,i)=>buckets[a].n>=b.n?a:i,0);
    const pct=(v,t)=>(v*100/t).toFixed(2)+'%';
    const ult=pts[pts.length-1];
    // pico e ponta em overlay HTML, posicionados em % — imunes ao esticamento do SVG
    const pico = buckets[iMax].n>0
      ? `<span class="pk" style="left:${pct(x(iMax),W)};top:${pct(y(buckets[iMax].n)-4,H)};${
           iMax===0?'transform:translate(0,-100%)':(iMax===buckets.length-1?'transform:translate(-100%,-100%)':'')}">${buckets[iMax].n}</span>`
      : '';
    const P=PERIODOS[periodo], fmt=P.fmt;
    const leg=b=>`${P.un?P.un+' ':''}${fmt(b.ini)}`;
    return `<div class="spark">
      <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img"
           aria-label="Leads por ${periodo} nas ${P.rot}; pico de ${buckets[iMax].n} em ${fmt(buckets[iMax].ini)}">
        <path d="${area}" fill="var(--teal)" fill-opacity=".1"></path>
        <path d="${linha}" fill="none" stroke="var(--teal)" stroke-width="2" stroke-linejoin="round"
              stroke-linecap="round" vector-effect="non-scaling-stroke"></path>
        <line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
      </svg>
      ${pico}<span class="dot" style="left:${pct(ult[0],W)};top:${pct(ult[1],H)}"></span>
      <div class="hit">${buckets.map(b=>`<span
        data-tip="<b>${b.n} lead(s)</b><br><span class='k'>${leg(b)}</span>"></span>`).join('')}</div>
    </div>
    <div class="axis"><span>${fmt(buckets[0].ini)}</span><span>${P.rot}</span><span>${fmt(buckets[buckets.length-1].ini)}</span></div>`;
  }
  const cidadesN = list => agruparPorCidade(list).length;
  function conta(list, keyFn){
    const m=new Map();
    list.forEach(x=>{ const k=keyFn(x); if(!k) return; m.set(k,(m.get(k)||0)+1); });   // '' e null ficam fora: rótulo vazio não é categoria
    return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0],'pt'));
  }
  function renderDash(list, totalGeral){
    const DIA=864e5, agora=Date.now();
    const ts=m=>{ const t=m.createdAt; if(!t) return null; const d=t.toDate?t.toDate():new Date(t); const n=d.getTime(); return isNaN(n)?null:n; };
    const j30=list.filter(m=>{const t=ts(m); return t!=null&&agora-t<=30*DIA;}).length;
    const j60=list.filter(m=>{const t=ts(m); return t!=null&&agora-t>30*DIA&&agora-t<=60*DIA;}).length;
    // Sem base anterior, "variação" não existe — mostrar "+100%" seria inventar tendência.
    const delta = j60>0 ? Math.round((j30-j60)*100/j60) : null;
    // "não respondidas" NÃO entra no dashboard: a equipe não responde pelo painel, então o número
    // mediria uma fila que não existe. O status da linha e o filtro continuam na tabela.
    const optin=list.filter(m=>m.marketing).length;
    const semUnid=list.filter(m=>!m.unidade&&!m.foraDeRaio).length;
    const fora=list.filter(m=>m.foraDeRaio===true);
    const porUnidade=conta(list,unidadeDe), porUf=conta(list,ufDe),
          porAssunto=conta(list,m=>m.assunto||null), porPraca=conta(fora,pracaDe);
    const cobertos=list.length-semUnid-fora.length;
    const mini=(n,l)=>`<div><div class="mn">${n}</div><div class="ml">${l}</div></div>`;
    // Uma figura-herói por vista, os secundários na MESMA faixa dela em corpo menor. Antes eram
    // cartões separados numa linha própria — hierarquia igual e uma faixa de altura desperdiçada.
    $('#dash').innerHTML=`
      <div class="hero">
        <div class="hero-head">
          <h3>Volume de leads</h3>
          <div class="seg">${[['dia','Dia'],['semana','Semana'],['mes','Mês']].map(([k,l])=>
            `<button data-per="${k}" class="${periodo===k?'on':''}">${l}</button>`).join('')}</div>
        </div>
        <div class="hero-stats">
          <div><div class="n">${list.length}</div><div class="l">leads no filtro</div></div>
          ${mini(delta===null?'<span class="chip">sem base</span>'
                  :`<span class="chip ${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${delta>=0?'+':''}${delta}%</span>`,
                 delta===null?'30 dias · sem comparação':`${j30} em 30 dias<br>contra ${j60} nos 30 anteriores`)}
          ${mini(list.length?Math.round(optin*100/list.length)+'%':'—',`aceitam marketing<br>${optin} na base de e-mail`)}
          ${mini(fora.length,fora.length?`sem loja em 150 km<br>${porPraca.length} praça(s) descoberta(s)`:'sem loja em 150 km<br>rede cobre a demanda ✓')}
        </div>
        ${areaChart(serie(list))}
      </div>
      <div class="panels">
        <div class="panel"><h3>Mapa de leads <span class="cnt">${porUf.length} UF(s) · ${cidadesN(list)} cidade(s)</span></h3>
          <p class="ph">Cada bolha é uma cidade; o tamanho é o volume. Clique numa bolha ou numa barra para filtrar o estado.</p>
          <div class="mapwrap">
            <div id="mapa"><p class="mapnote">Carregando mapa…</p></div>
            <div>${bars(porUf,list.length,'if-uf',$('#if-uf').value,'uf')}</div>
          </div></div>
        <!-- coluna com dois cartões curtos empilhados: juntos alcançam a altura do mapa, em vez de
             deixar um cartão baixo sozinho ao lado dele e um rombo de 200px embaixo -->
        <div class="pcol">
          <div class="panel"><h3>Unidades que recebem os leads <span class="cnt">${porUnidade.length} unidade(s)</span></h3>
            <p class="ph">${cobertos} com loja em até 150 km${semUnid?` · ${semUnid} sem localização`:''}. Clique para filtrar.</p>
            ${bars(porUnidade,list.length,'if-unidade',$('#if-unidade').value)}</div>
          <div class="panel"><h3>Motivo do contato <span class="cnt">${porAssunto.length} assunto(s)</span></h3>
            <p class="ph">Assunto escolhido no formulário. Clique para filtrar.</p>
            ${bars(porAssunto,list.length,'if-assunto',$('#if-assunto').value)}</div>
        </div>
        <div class="panel warn span2"><h3>⚠ Demanda sem loja perto ${fora.length?`<span class="cnt">${fora.length} lead(s)</span>`:''}</h3>
          <p class="ph">${fora.length
            ? `A mais de 150 km da unidade mais próxima — foram pro localizador, não pra uma loja. É o mapa de expansão.`
            : 'Nenhum lead fora do raio de 150 km. A rede cobre toda a demanda que chegou.'}</p>
          ${fora.length?bars(porPraca,list.length,'praca',null,'praca'):''}</div>
      </div>`;
    wireTips($('#dash'));
    renderMapa(list, $('#if-uf').value);   // assíncrono: o mapa preenche o vão quando a geometria chega
    $('#dash').querySelectorAll('[data-exp]').forEach(b=>b.addEventListener('click',()=>{
      const k=b.dataset.exp; expandido[k]=!expandido[k]; renderDash(list,totalGeral);
    }));
    $('#dash').querySelectorAll('[data-per]').forEach(b=>b.addEventListener('click',()=>{
      periodo=b.dataset.per; renderDash(list,totalGeral);
    }));
    $('#dash').querySelectorAll('.bar').forEach(b=>b.addEventListener('click',()=>{
      const f=b.dataset.f, val=b.dataset.v;
      if(f==='praca'){ // praça não é campo indexado: filtra pelos leads fora de raio + busca a cidade
        $('#if-unidade').value=F_FORA;
        $('#if-q').value=(val.split('/')[0]||'').trim();
      } else {
        const sel=$('#'+f);
        sel.value = sel.value===val ? '' : val;   // clicar de novo no mesmo desliga o filtro
      }
      apply();
    }));
  }

  /* ----- backfill do histórico ----- */
  // Leads gravados antes de 11/08/2026 têm CEP mas não têm unidade. Sem isto o mapa começaria
  // vazio, ignorando todo o histórico já coletado. Sequencial e com pausa: as APIs de CEP são
  // públicas e gratuitas — rajada de 500 chamadas leva rate-limit e devolve nada.
  function renderBackfill(){
    const pend=all.filter(pendenteGeo);
    const w=$('#bfwrap');
    if(!pend.length){ w.innerHTML=''; return; }
    w.innerHTML=`<div class="bfbar"><div class="t">${pend.length} lead(s) antigo(s) têm CEP mas ainda não têm a loja identificada.</div>
      <button class="btn btn--ghost btn--sm" id="bf-run">Identificar as unidades (${pend.length})</button></div>`;
    $('#bf-run').addEventListener('click',async()=>{
      const btn=$('#bf-run'), box=btn.closest('.bfbar'), t=box.querySelector('.t');
      btn.disabled=true;
      silenciar=true;          // o listener continua recebendo; só não re-renderiza no meio do loop
      let ok=0, fail=0;
      for(let i=0;i<pend.length;i++){
        const m=pend[i];
        t.innerHTML=`<strong>Identificando ${i+1} de ${pend.length}…</strong> ${ok} resolvido(s)${fail?`, ${fail} sem resultado`:''}. Pode continuar usando o painel.`;
        let a;
        try{ a=await analisarCep(m.cep); }catch(_){ a=null; }
        const upd = a ? {...a, geoAt:new Date().toISOString()} : {geoAt:new Date().toISOString()};
        try{
          await db.collection('contact_messages').doc(m.id).update(upd);
          Object.assign(m,upd);            // mantém o array local em sincronia com o banco
          if(a&&a.unidade) ok++; else fail++;
        }catch(_){ fail++; }
        await new Promise(r=>setTimeout(r,350));   // respeita o rate-limit das APIs públicas de CEP
      }
      // Volta a ouvir e re-renderiza UMA vez, já com as unidades e UFs que o backfill acabou de criar.
      silenciar=false;
      sincronizarFiltros(); badgeInbox(); apply();
      // O resumo entra DEPOIS do apply e como linha extra: se alguma escrita falhou, a barra de
      // pendentes reaparece embaixo dele em vez de ser encoberta por um "pronto" que mentiria.
      $('#bfwrap').insertAdjacentHTML('afterbegin',
        `<div class="bfbar"><div class="t"><strong>Pronto: ${ok} unidade(s) identificada(s)${fail?`, ${fail} CEP(s) sem resultado`:''}.</strong></div></div>`);
    });
  }

  function render(list){
    if(!list.length){ $('#rows').innerHTML='<div class="empty">Nenhuma mensagem com esses filtros.</div>'; return; }
    let h='<table><thead><tr><th>Quando</th><th>Nome</th><th>Contato</th><th>Origem / unidade</th><th>Assunto</th><th>Mensagem</th><th>Mkt</th><th>Status</th><th></th></tr></thead><tbody>';
    list.forEach(m=>{ const stt=(m.status||'new');
      const un=unidadeDe(m);
      // `distanciaKm` é a distância até a MAIS PRÓXIMA. Só pode ser exibida junto de uma unidade
      // quando é ela mesma — escrever "Brooklin, a 251 km do CEP" seria falso, porque os 251 km
      // são até Florianópolis. Por isso a legenda muda conforme o motivo da rota.
      const legenda = m.rotaMotivo==='propria'
          ? 'loja própria — nenhuma unidade em 150 km'
          : m.rotaMotivo==='repetido'
            ? `a ${m.distanciaKm} km · 3ª ocorrência deste e-mail`
            : (m.distanciaKm!=null ? `a ${m.distanciaKm} km do CEP` : '');
      const cel = un
        ? `<strong>${esc(un)}</strong>${legenda?`<br><span class="hint">${esc(legenda)}</span>`:''}`
        : m.foraDeRaio
          ? `<span class="tag pending">sem loja em 150 km</span>${m.unidade?`<br><span class="hint">+ próxima: ${esc(m.unidade)}, ${m.distanciaKm} km</span>`:''}`
          : `<span class="hint">—</span>`;   // sem CEP ou CEP que não resolve: neutro, não é pendência

const ST_LABEL={pending:'pendente',approved:'aprovado',rejected:'recusado'};
async function vPresc(){
  const v=$('#view');
  v.innerHTML=`<div class="topbar"><div><h1 class="page">Cadastros de prescritores</h1><p class="hint" id="p-count"></p></div><button class="btn" id="p-csv">⬇ Exportar CSV</button></div>
  <div class="toolbar">
    <select class="fld" id="f-status" style="max-width:170px"><option value="">Status: todos</option><option value="pending">Pendentes</option><option value="approved">Aprovados</option><option value="rejected">Recusados</option></select>
    <select class="fld" id="f-esp" style="max-width:230px"><option value="">Especialidade: todas</option></select>
    <select class="fld" id="f-uf" style="max-width:120px"><option value="">UF: todas</option></select>
    <select class="fld" id="f-cidade" style="max-width:200px"><option value="">Cidade: todas</option></select>
    <input class="fld search" id="f-q" placeholder="Buscar nome, e-mail, telefone…">
    <button class="btn btn--ghost btn--sm" id="f-clear">Limpar</button>
  </div><div id="rows">Carregando…</div>`;
  let snap;
  try{ snap = await db.collection('prescribers').orderBy('createdAt','desc').limit(1000).get(); }
  catch(e){ $('#rows').innerHTML='<div class="empty">Não foi possível carregar os cadastros. Recarregue a página.</div>'; return; }
  const all = snap.docs.map(d=>({id:d.id,...d.data()}));
  const fill=(sel,vals)=>{const s=$(sel);[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt')).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o);});};
  fill('#f-esp',all.map(m=>m.especialidade)); fill('#f-uf',all.map(m=>m.uf)); fill('#f-cidade',all.map(m=>m.cidade));
  let current=all;
  function apply(){
    const st=$('#f-status').value, ep=$('#f-esp').value, uf=$('#f-uf').value, ci=$('#f-cidade').value;
    const q=$('#f-q').value.trim().toLowerCase();
    current=all.filter(m=>(!st||m.status===st)&&(!ep||m.especialidade===ep)&&(!uf||m.uf===uf)&&(!ci||m.cidade===ci)
      &&(!q||[m.nome,m.email,m.telefone,m.cidade,m.conselhoNumero].some(x=>String(x||'').toLowerCase().includes(q))));
    const n={pending:0,approved:0,rejected:0}; all.forEach(m=>{if(n[m.status]!=null)n[m.status]++;});
    $('#p-count').textContent=`${current.length} de ${all.length} cadastro(s) · ${n.pending} pendente(s), ${n.approved} aprovado(s), ${n.rejected} recusado(s).`;
    render(current);
  }
  function render(list){
    if(!list.length){ $('#rows').innerHTML='<div class="empty">Nenhum cadastro com esses filtros.</div>'; return; }
    let h='<table><thead><tr><th>Quando</th><th>Nome</th><th>Conselho</th><th>Cidade/UF</th><th>Contato</th><th>Status</th><th></th></tr></thead><tbody>';
    list.forEach(m=>{
      h+=`<tr><td>${fmtTs(m.createdAt)}</td><td><strong>${esc(m.nome)}</strong><br><span class="hint">${esc(m.especialidade||'')}</span></td>
      <td>${esc((m.conselho||'')+' '+(m.conselhoNumero||'')+(m.uf?'/'+m.uf:''))}</td>
      <td>${esc(m.cidade||'—')}${m.uf?'/'+esc(m.uf):''}</td>
      <td>${esc(m.email)}<br><span class="hint">${esc(m.telefone||'')}</span></td>
      <td><span class="tag ${m.status}">${ST_LABEL[m.status]||esc(m.status)}</span></td>
      <td>${m.status==='approved'
        ?`<button class="btn btn--danger btn--sm" data-rj="${m.id}">Revogar</button>`
        :`<button class="btn btn--ghost btn--sm" data-ap="${m.id}">Aprovar</button> <button class="btn btn--danger btn--sm" data-rj="${m.id}">Recusar</button>`}</td></tr>`;
    });
    h+='</tbody></table>'; $('#rows').innerHTML=h;
    wire();
  }
  ['#f-status','#f-esp','#f-uf','#f-cidade'].forEach(s=>$(s).addEventListener('change',apply));
  $('#f-q').addEventListener('input',apply);
  $('#f-clear').addEventListener('click',()=>{['#f-status','#f-esp','#f-uf','#f-cidade','#f-q'].forEach(s=>$(s).value='');apply();});
  $('#p-csv').addEventListener('click',()=>{
    const rows=[['data','nome','email','telefone','conselho','registro','uf','cidade','especialidade','cnpj','status']];
    current.forEach(m=>rows.push([fmtTsCSV(m.createdAt),m.nome,m.email,m.telefone||'',m.conselho||'',m.conselhoNumero||'',m.uf||'',m.cidade||'',m.especialidade||'',m.cnpj||'',ST_LABEL[m.status]||m.status]));
    const csv='﻿'+rows.map(r=>r.map(c=>`"${csvSafe(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='prescritores-aformula.csv'; a.click();
  });
  function wire(){
  async function decide(id, action, btn){
    if(!auth.currentUser){ alert('Sessão expirou. Recarregue a página e entre de novo.'); return; }
    // Trava OS DOIS botões da linha (Aprovar + Recusar) — evita disparar aprovar e recusar em corrida.
    const row=btn.closest('tr'), rowBtns=row?[...row.querySelectorAll('button')]:[btn];
    rowBtns.forEach(b=>b.disabled=true); btn.textContent='…';
    try{
      const token=await auth.currentUser.getIdToken();
      const r=await fetch('/api/prescritor-decide',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({id,action})});
      const j=await r.json();
      if(!j.ok) throw new Error(j.error||'falha');
      if(action==='approve'){
        const bg=document.createElement('div'); bg.className='modal-bg';
        bg.innerHTML=`<div class="modal"><h2>Prescritor aprovado ✓</h2>
          <p>${j.emailSent?'O prescritor recebeu um e-mail com o link para criar a senha.':'<strong>O e-mail automático não pôde ser enviado</strong> (domínio ainda não verificado no Resend). Envie o link abaixo por WhatsApp ou e-mail:'}</p>
          <label>Link para o prescritor definir a senha (válido por tempo limitado)</label>
          <input class="fld" id="rl" readonly value="${esc(j.resetLink)}">
          <div class="row" style="margin-top:14px"><button class="btn" id="rl-copy" style="flex:0">Copiar link</button><button class="btn btn--ghost" id="rl-close" style="flex:0">Fechar</button></div>
        </div>`;
        document.body.appendChild(bg);
        bg.querySelector('#rl-copy').addEventListener('click',async()=>{
          const link=bg.querySelector('#rl').value;
          try{ await navigator.clipboard.writeText(link); }
          catch(_){ bg.querySelector('#rl').select(); try{document.execCommand('copy');}catch(__){} }
          bg.querySelector('#rl-copy').textContent='Copiado ✓';
        });
        bg.querySelector('#rl-close').addEventListener('click',()=>{bg.remove();loadCounts();vPresc();});
      } else { loadCounts(); vPresc(); }
    }catch(e){ alert('Não foi possível concluir: '+e.message); loadCounts(); vPresc(); }
  }
  v.querySelectorAll('[data-ap]').forEach(b=>b.addEventListener('click',()=>decide(b.dataset.ap,'approve',b)));
  v.querySelectorAll('[data-rj]').forEach(b=>b.addEventListener('click',()=>{ if(confirm('Recusar/revogar este cadastro? O acesso (se existir) será desativado.')) decide(b.dataset.rj,'reject',b); }));
  }
  apply();
}

/* ---------- CONTEÚDO DO PRESCRITOR (área logada — vale na hora, sem Publicar) ---------- */
const PC_TYPES={artigo:'Artigo científico',pdf:'PDF',formula:'Fórmula sugerida'};
async function vPreContent(){
  const v=$('#view'); v.innerHTML='<div class="topbar"><div><h1 class="page">Conteúdo do prescritor</h1><p class="hint">Artigos, PDFs e fórmulas da área logada. Vale na hora — não precisa de “Publicar”.</p></div><button class="btn" id="new">+ Novo conteúdo</button></div><div id="rows">Carregando…</div>';

  catch(e){ $('#rows').innerHTML='<div class="empty">Não foi possível carregar o conteúdo. Recarregue a página.</div>'; $('#new').addEventListener('click',()=>editPreContent(null)); return; }
  const items = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.publishedAt||'').localeCompare(a.publishedAt||''));
  if(!items.length){ $('#rows').innerHTML='<div class="empty">Nenhum conteúdo ainda. Clique em “+ Novo conteúdo”.</div>'; }
  else{
    let h='<table><thead><tr><th>Data</th><th>Título</th><th>Tipo</th><th></th><th></th></tr></thead><tbody>';
    items.forEach(p=>{h+=`<tr><td>${(p.publishedAt||'').slice(0,10)}</td><td class="postrow-title">${esc(p.title)}</td><td>${PC_TYPES[p.type]||esc(p.type)}</td>
      <td><button class="btn btn--ghost btn--sm" data-edit="${p.id}">Editar</button></td>
      <td><button class="btn btn--danger btn--sm" data-del="${p.id}">Excluir</button></td></tr>`;});
    h+='</tbody></table>'; $('#rows').innerHTML=h;
    v.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>editPreContent(items.find(p=>p.id===b.dataset.edit))));

      const p=items.find(x=>x.id===b.dataset.del);
      if(confirm(`Excluir “${p.title}”? Some da área do prescritor imediatamente.`)){
        try{ await db.collection('prescriber_content').doc(p.id).delete(); }
        catch(err){ alert('Não foi possível excluir: '+err.message); return; }
        vPreContent();
      }

function editPreContent(p){
  const isNew=!p; p=p||{type:'artigo'};
  const typeOpts=Object.entries(PC_TYPES).map(([k,l])=>`<option value="${k}" ${k===p.type?'selected':''}>${l}</option>`).join('');
  const bg=document.createElement('div'); bg.className='modal-bg';
  bg.innerHTML=`<div class="modal"><h2>${isNew?'Novo conteúdo':'Editar conteúdo'}</h2>
    <label>Título</label><input class="fld" id="c-title" value="${esc(p.title||'')}">
    <div class="row"><div><label>Tipo</label><select class="fld" id="c-type">${typeOpts}</select></div>
    <div><label>Data (AAAA-MM-DD)</label><input class="fld" id="c-date" value="${(p.publishedAt||new Date().toISOString()).slice(0,10)}"></div></div>
    <div id="c-pdf-row" class="hidden"><label>Arquivo PDF</label>
      <div class="row"><input class="fld" id="c-file-url" readonly placeholder="Nenhum arquivo enviado" value="${esc(p.fileUrl||'')}">
      <button class="btn btn--ghost" id="c-upl" style="flex:0">⬆ Enviar PDF</button></div>
      <input type="file" id="c-file" accept="application/pdf" class="hidden">
      <label style="margin-top:14px">Resumo (aparece no card)</label><textarea class="fld" id="c-exc" style="min-height:70px">${esc(p.excerpt||'')}</textarea></div>
    <div id="c-body-row"><label>Conteúdo (HTML — use &lt;h3&gt;, &lt;p&gt;, &lt;ul&gt;&lt;li&gt;, &lt;strong&gt;)</label>
      <textarea class="fld code" id="c-body" style="min-height:220px">${esc(p.body||'<p></p>')}</textarea></div>
    <p class="msg" id="c-msg"></p>
    <div class="row" style="margin-top:14px"><button class="btn" id="c-save" style="flex:0">Salvar</button><button class="btn btn--ghost" id="c-cancel" style="flex:0">Cancelar</button></div>
  </div>`;
  document.body.appendChild(bg);
  const q=s=>bg.querySelector(s);
  function syncType(){ const t=q('#c-type').value; q('#c-pdf-row').classList.toggle('hidden',t!=='pdf'); q('#c-body-row').classList.toggle('hidden',t==='pdf'); }
  syncType(); q('#c-type').addEventListener('change',syncType);
  q('#c-cancel').addEventListener('click',()=>bg.remove());
  bg.addEventListener('click',e=>{if(e.target===bg)bg.remove();});
  q('#c-upl').addEventListener('click',()=>q('#c-file').click());
  q('#c-file').addEventListener('change',async()=>{
    const f=q('#c-file').files[0]; if(!f) return; const m=q('#c-msg');
    m.className='msg'; m.textContent='Enviando PDF…';
    try{ q('#c-file-url').value=await uploadFile(f); m.className='msg ok'; m.textContent='PDF enviado ✓'; }
    catch(e){ m.className='msg err'; m.textContent=e.message; }
  });
  q('#c-save').addEventListener('click',async()=>{
    const m=q('#c-msg'); const title=q('#c-title').value.trim(); const type=q('#c-type').value;
    if(!title){m.className='msg err';m.textContent='Título é obrigatório.';return;}
    if(type==='pdf'&&!q('#c-file-url').value){m.className='msg err';m.textContent='Envie o arquivo PDF.';return;}
    const dateStr=q('#c-date').value.trim();
    if(!/^\d{4}-\d{2}-\d{2}$/.test(dateStr)||isNaN(new Date(dateStr+'T10:00:00').getTime())){m.className='msg err';m.textContent='Data inválida — use o formato AAAA-MM-DD.';return;}
    const doc={ title, type, publishedAt:dateStr+'T10:00:00',
      excerpt:q('#c-exc')?q('#c-exc').value.trim():'',
      body:type==='pdf'?'':q('#c-body').value, fileUrl:type==='pdf'?q('#c-file-url').value:'' };
    m.className='msg'; m.textContent='Salvando…';
    try{
      if(p.id) await db.collection('prescriber_content').doc(p.id).set(doc,{merge:true});
      else await db.collection('prescriber_content').add(doc);
    }catch(err){ m.className='msg err'; m.textContent='Não foi possível salvar: '+err.message; return; }
    bg.remove(); vPreContent();
  });
}

/* ---------- NEWSLETTER ---------- */
async function vNews(){
  const v=$('#view');
  v.innerHTML=`<div class="topbar"><div><h1 class="page">Inscritos na newsletter</h1><p class="hint" id="ncount"></p></div><button class="btn" id="n-csv">⬇ Exportar CSV</button></div>
  <div class="toolbar">
    <select class="fld" id="nf-src" style="max-width:220px"><option value="">Origem: todas</option></select>
    <input class="fld search" id="nf-q" placeholder="Buscar e-mail…">
    <button class="btn btn--ghost btn--sm" id="nf-clear">Limpar</button>
  </div><div id="rows">Carregando…</div>`;
  let snap;
  try{ snap = await db.collection('newsletter').orderBy('createdAt','desc').limit(1000).get(); }
  catch(e){ $('#rows').innerHTML='<div class="empty">Não foi possível carregar os inscritos. Recarregue a página.</div>'; return; }
  if(snap.empty){ $('#ncount').textContent='Nenhum inscrito ainda.'; $('#rows').innerHTML='<div class="empty">Nenhum inscrito ainda.</div>'; return; }
  const all = snap.docs.map(d=>({id:d.id,...d.data()}));
  const fill=(sel,vals)=>{const s=$(sel);[...new Set(vals.filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt')).forEach(x=>{const o=document.createElement('option');o.value=x;o.textContent=x;s.appendChild(o);});};
  fill('#nf-src',all.map(m=>m.source));
  let current=all;
  function apply(){
    const sr=$('#nf-src').value, q=$('#nf-q').value.trim().toLowerCase();
    current=all.filter(m=>(!sr||m.source===sr)&&(!q||String(m.email||'').toLowerCase().includes(q)));
    $('#ncount').textContent=`${current.length} de ${all.length} inscrito(s).`;
    render(current);
  }
  function render(list){
    if(!list.length){ $('#rows').innerHTML='<div class="empty">Nenhum inscrito com esses filtros.</div>'; return; }
    let h='<table><thead><tr><th>Quando</th><th>E-mail</th><th>Origem</th><th></th></tr></thead><tbody>';
    list.forEach(m=>{ h+=`<tr><td>${fmtTs(m.createdAt)}</td><td>${esc(m.email)}</td><td>${esc(m.source||'')}</td><td><button class="btn btn--danger btn--sm" data-ndel="${m.id}">Apagar</button></td></tr>`; });
    h+='</tbody></table>'; $('#rows').innerHTML=h;
    $('#rows').querySelectorAll('[data-ndel]').forEach(b=>b.addEventListener('click',async()=>{
      if(!confirm('Remover este e-mail da base de mailing?')) return; b.disabled=true;
      if(!await adminDelete('newsletter', b.dataset.ndel)){ b.disabled=false; return; }
      const i=all.findIndex(x=>x.id===b.dataset.ndel); if(i>=0)all.splice(i,1);
      apply();
    }));
  }
  $('#nf-src').addEventListener('change',apply);
  $('#nf-q').addEventListener('input',apply);
  $('#nf-clear').addEventListener('click',()=>{$('#nf-src').value='';$('#nf-q').value='';apply();});
  $('#n-csv').addEventListener('click',()=>{
    const rows=[['email','origem','data']];
    current.forEach(m=>rows.push([m.email,m.source||'',fmtTsCSV(m.createdAt)]));
    const csv='﻿'+rows.map(r=>r.map(c=>`"${csvSafe(c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='newsletter-aformula.csv'; a.click();
  });
  apply();
}

/* ---------- SETTINGS ---------- */
async function vSettings(){
  const v=$('#view'); v.innerHTML='<div class="topbar"><div><h1 class="page">Configurações</h1><p class="hint">Dados globais usados no site inteiro.</p></div></div><div class="card" style="max-width:720px" id="sx">Carregando…</div>';
  let d;
  try{ d=await db.collection('settings').doc('global').get(); }
  catch(e){ $('#sx').innerHTML='Não foi possível carregar as configurações. Recarregue a página.'; return; }
  const s=d.data()||{};
  const f=(k,l,ph)=>`<div><label>${l}</label><input class="fld" id="s-${k}" value="${esc(s[k]||'')}"${ph?` placeholder="${ph}"`:''}></div>`;
  $('#sx').innerHTML=`<div class="row">${f('years','Anos de história','ex.: 38 (só o número)')}${f('notifyEmail','E-mail p/ notificações','nome@dominio.com.br')}</div>
    <div class="row">${f('sacEmail','E-mail SAC','sac@aformulabr.com.br')}${f('petEmail','E-mail Pet','pet@aformulabr.com.br')}</div>
    ${f('franchiseUrl','URL Seja franqueado','https://…')}
    <div class="row">${f('instagram','Instagram (URL completa)','https://www.instagram.com/…')}${f('facebook','Facebook (URL completa)','https://www.facebook.com/…')}</div>
    <div class="row">${f('youtube','YouTube (URL completa)','https://www.youtube.com/@…')}${f('linkedin','LinkedIn (URL completa)','https://www.linkedin.com/company/…')}</div>
    ${f('recaptchaSiteKey','reCAPTCHA site key (cadastro de prescritor)','6L…')}
    <p class="hint" style="margin-top:10px">Campo vazio ou em formato inválido é ignorado na publicação — o site mantém o valor atual.</p>
    <p class="msg" id="s-msg"></p><div style="margin-top:14px"><button class="btn" id="s-save">Salvar</button></div>`;
  $('#s-save').addEventListener('click',async()=>{
    const m=$('#s-msg');
    const yearsRaw=$('#s-years').value.trim();
    if(yearsRaw && !/^\d{1,3}$/.test(yearsRaw)){ m.className='msg err'; m.textContent='“Anos de história”: digite só o número (ex.: 38).'; return; }
    const keys=['years','notifyEmail','sacEmail','petEmail','franchiseUrl','instagram','facebook','youtube','linkedin','recaptchaSiteKey'];
    const upd={}; keys.forEach(k=>{let val=$('#s-'+k).value; if(k==='years')val=parseInt(val)||val; upd[k]=val;});
    m.className='msg';m.textContent='Salvando…';
    try{ await db.collection('settings').doc('global').set(upd,{merge:true}); }
    catch(e){ m.className='msg err'; m.textContent='Não foi possível salvar: '+e.message; return; }
    m.className='msg ok';m.textContent='Salvo.';
  });
}

/* ---------- PUBLICAR ---------- */
async function triggerBuild(target){
  const token = await auth.currentUser.getIdToken();
  const r = await fetch('/api/publish?target='+target,{method:'POST',headers:{Authorization:'Bearer '+token}});
  const data = await r.json().catch(()=>({}));
  if(!r.ok || !data.ok) throw new Error(data.error||'falha');
  return data;
}
$('#btn-publish').addEventListener('click',async()=>{
  const btn=$('#btn-publish'), pb=$('#pubbar'), t=$('#pub-title'), hint=$('#pub-hint');
  if(!confirm('Publicar as alterações no site ao vivo? Leva 1–2 minutos.')) return;
  btn.disabled=true; t.textContent='Publicando…'; hint.textContent='Isso leva 1–2 minutos. Pode continuar usando o painel.';
  try{
    await triggerBuild('production');
    pb.classList.add('clean'); t.textContent='Publicação iniciada ✓'; hint.textContent='O site no ar reflete as mudanças em 1–2 minutos.';
  }catch(e){ t.textContent='Não foi possível publicar.'; hint.textContent='Tente de novo; se persistir, avise o suporte técnico.'; }
  finally{ btn.disabled=false; }
});
</script>
